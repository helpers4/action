name: Pull Request Validation

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read
  pull-requests: write

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check conventional commits
        uses: helpers4/action/conventional-commits@main
        with:
          checkout: "true"
          pr-comment: "error"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: warning

  validate-action-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate action.yml syntax
        run: |
          for f in conventional-commits/action.yml setup-pnpm/action.yml \
                   pr-status-comment/action.yml trigger-website-update/action.yml; do
            echo "→ $f"
            yq eval '.' "$f" > /dev/null
          done

  test-setup-pnpm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Test: setup-pnpm without install"
        uses: ./setup-pnpm
        with:
          node-version: "24"
          version: "10"
          install: "false"
          cache: "false"

      - name: "Test: node and pnpm are on PATH"
        run: |
          node --version
          pnpm --version

  test-pr-status-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Test: build-comment.sh produces a status table"
        env:
          INPUT_JOBS: '{"Build": "success", "Tests": "failure"}'
          INPUT_EXTRA_MARKDOWN: ""
        run: |
          OUTPUT=$(bash pr-status-comment/scripts/build-comment.sh)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "1/2 checks passed"
          echo "$OUTPUT" | grep -q "passing"
          echo "$OUTPUT" | grep -q "failing"

      - name: "Test: script is executable and has valid syntax"
        run: bash -n pr-status-comment/scripts/build-comment.sh

  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Test: valid conventional commit"
        run: |
          # Test with known valid commits from this repo
          INPUT_BASE_SHA="" \
          INPUT_HEAD_SHA="" \
          INPUT_TYPES="feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert" \
          INPUT_SCOPES="" \
          INPUT_REQUIRE_SCOPE="false" \
          INPUT_IGNORE_COMMITS="^Merge branch|^Initial commit" \
          INPUT_VALIDATE_PR_TITLE="false" \
          INPUT_PR_COMMENT="none" \
          GITHUB_BASE_REF="main" \
          bash conventional-commits/scripts/validate.sh || true

      - name: "Test: script is executable and has valid syntax"
        run: bash -n conventional-commits/scripts/validate.sh

  pr-comment:
    runs-on: ubuntu-latest
    needs:
      [
        conventional-commits,
        shellcheck,
        test-action,
        validate-action-manifests,
        test-setup-pnpm,
        test-pr-status-comment,
      ]
    if: always()
    steps:
      - name: Update PR comment
        uses: helpers4/action/pr-status-comment@main
        with:
          jobs: |
            {
              "🧾 Conventional Commits": "${{ needs.conventional-commits.result }}",
              "🐚 ShellCheck": "${{ needs.shellcheck.result }}",
              "🧪 Action Tests": "${{ needs.test-action.result }}",
              "📄 Manifest Validation": "${{ needs.validate-action-manifests.result }}",
              "📦 setup-pnpm Tests": "${{ needs.test-setup-pnpm.result }}",
              "💬 pr-status-comment Tests": "${{ needs.test-pr-status-comment.result }}"
            }
