name: Setup pnpm
description: Setup Node.js + pnpm via corepack, optionally installing dependencies
author: helpers4
branding:
  icon: package
  color: blue
inputs:
  node-version:
    description: Node.js version to install (passed to actions/setup-node)
    required: true
  install:
    description: Run "pnpm install" after setup
    required: false
    default: "true"
  frozen-lockfile:
    description: Pass --frozen-lockfile to "pnpm install" (ignored if install is false)
    required: false
    default: "true"
  working-directory:
    description: Directory to run "pnpm install" in
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable corepack
      shell: bash
      run: corepack enable

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        if [[ "$INPUT_FROZEN_LOCKFILE" == "true" ]]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
