name: Setup pnpm
description: Setup Node.js + pnpm, optionally installing dependencies
author: helpers4
branding:
  icon: package
  color: blue
inputs:
  node-version:
    description: Node.js version to install (passed to actions/setup-node)
    required: true
  version:
    description: pnpm version to install (leave empty to auto-detect from the "packageManager" field in package.json)
    required: false
    default: ""
  install:
    description: Run "pnpm install" after setup
    required: false
    default: "true"
  frozen-lockfile:
    description: Pass --frozen-lockfile to "pnpm install" (ignored if install is false)
    required: false
    default: "true"
  working-directory:
    description: Directory containing package.json / pnpm-lock.yaml, and where "pnpm install" runs
    required: false
    default: "."
  cache:
    description: Cache the pnpm store directory (passed to pnpm/action-setup)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.0.9
      with:
        version: ${{ inputs.version }}
        package_json_file: ${{ inputs.working-directory }}/package.json
        cache: ${{ inputs.cache }}
        cache_dependency_path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      if: ${{ inputs.install == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
      run: |
        if [[ "$INPUT_FROZEN_LOCKFILE" == "true" ]]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
